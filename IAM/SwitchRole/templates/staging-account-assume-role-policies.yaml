AWSTemplateFormatVersion: "2010-09-09"
Description: |
  [ベースアカウント（検証環境を兼ねる）側] スイッチロール権限（AssumeRole 許可ポリシー）定義テンプレート

  ベースアカウントは検証（Staging）環境そのものを兼ねる。そのため、
  ../../IAMIdentityCenter/sample/before/iam-groups.yaml で作成済みの
  DevelopersTestGroup / InfraTestGroup は削除・再作成せず、
  「検証環境での直接権限（PowerUserAccess・カスタムポリシー）」としてそのまま存続させる。

  本テンプレートは、その既存グループに対して
  「開発アカウントへの AssumeRole 許可」を追加でアタッチするだけのテンプレート。
  AWS::IAM::ManagedPolicy の Groups プロパティは対象グループを「名前」で指定できるため、
  DevelopersTestGroup / InfraTestGroup を別スタックのリソースとして再定義する必要はない。

  商用環境へのアクセスは、既存グループとは別に新設する ProdOperators グループ
  （本テンプレートで作成）にのみ許可する。

  グループへの「誰を所属させるか」（ユーザー ↔ グループの割り当て）は
  このテンプレートの管理対象外（頻繁に変わる人事異動由来の情報のため）。
  IAM Identity Center 移行検討時の CloudFormation 管理方針
  （../../IAMIdentityCenter/02-CloudFormation管理方針.md）と同じ考え方を踏襲している。

# ==============================================================================
# Parameters
# ==============================================================================
Parameters:
  ExistingDevelopersGroupName:
    Type: String
    Description: 既存の開発者グループ名（../../IAMIdentityCenter/sample/before/iam-groups.yaml の GroupName）
    Default: DevelopersTestGroup

  ExistingInfraGroupName:
    Type: String
    Description: 既存のインフラグループ名（../../IAMIdentityCenter/sample/before/iam-groups.yaml の GroupName）
    Default: InfraTestGroup

  DevDevelopersRoleArn:
    Type: String
    Description: 開発アカウントの DevelopersRole ARN（target-account-roles.yaml の Outputs から取得）

  DevInfraRoleArn:
    Type: String
    Description: 開発アカウントの InfraRole ARN（target-account-roles.yaml の Outputs から取得）

  ProdDevelopersRoleArn:
    Type: String
    Description: 商用アカウントの DevelopersRole ARN（target-account-roles.yaml の Outputs から取得）

  ProdInfraRoleArn:
    Type: String
    Description: 商用アカウントの InfraRole ARN（target-account-roles.yaml の Outputs から取得）

# ==============================================================================
# Resources
# ==============================================================================
Resources:

  # ----------------------------------------------------------------------------
  # AssumeRole 許可ポリシー（開発環境）
  # 既存の DevelopersTestGroup / InfraTestGroup に、Groups プロパティで直接アタッチする
  # （検証環境自体の権限である PowerUserAccess / カスタムポリシーはそのまま維持される）
  # ----------------------------------------------------------------------------
  AssumeDevDevelopersRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: AssumeDevDevelopersRolePolicy
      Description: 開発アカウントの DevelopersRole への AssumeRole を許可（既存の開発者グループに追加アタッチ）
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeDevDevelopersRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Ref DevDevelopersRoleArn
      Groups:
        - !Ref ExistingDevelopersGroupName

  AssumeDevInfraRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: AssumeDevInfraRolePolicy
      Description: 開発アカウントの InfraRole への AssumeRole を許可（既存のインフラグループに追加アタッチ）
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeDevInfraRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Ref DevInfraRoleArn
      Groups:
        - !Ref ExistingInfraGroupName

  # ----------------------------------------------------------------------------
  # 商用環境オペレーターグループ（新設）
  # 商用環境への AssumeRole を許可する少数精鋭グループ。
  # メンバーの追加・削除はこのテンプレートの管理対象外（手動 or 別スクリプトで運用）
  # ----------------------------------------------------------------------------
  ProdOperatorsGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: ProdOperators

  # ----------------------------------------------------------------------------
  # AssumeRole 許可ポリシー（商用環境。ProdOperators グループにのみアタッチする）
  # ----------------------------------------------------------------------------
  AssumeProdDevelopersRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: AssumeProdDevelopersRolePolicy
      Description: 商用環境の DevelopersRole への AssumeRole を許可（ProdOperators グループ専用）
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeProdDevelopersRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Ref ProdDevelopersRoleArn
      Groups:
        - !Ref ProdOperatorsGroup

  AssumeProdInfraRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: AssumeProdInfraRolePolicy
      Description: 商用環境の InfraRole への AssumeRole を許可（ProdOperators グループ専用）
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AssumeProdInfraRole
            Effect: Allow
            Action: sts:AssumeRole
            Resource: !Ref ProdInfraRoleArn
      Groups:
        - !Ref ProdOperatorsGroup
