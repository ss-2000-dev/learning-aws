AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Test

Resources:
  MyEcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: my-sample-ecs-cluster
      ClusterSettings:
        - Name: "containerInsights"
          Value: "enhanced"
          # Value: "enabled"
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  # ECSを実行する権限
  MyTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsTaskExecutionRoleForECSTest
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: S3FullAccessForConfigFetch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:*"
                Resource: "*"

  # ECS自身の権限
  MyTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ecsTaskRoleForECSTest
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FluentBitFullDestinations
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudWatch Logs への全権限
              - Effect: Allow
                Action:
                  - "logs:*"
                Resource: "*"
              # S3 への全権限
              - Effect: Allow
                Action:
                  - "s3:*"
                Resource: "*"

  MyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/ecs/example-task-for-test
      RetentionInDays: 7

  MyTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: example-task-for-ecs-test
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt MyTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt MyTaskRole.Arn
      ContainerDefinitions:
        # アプリケーションコンテナ
        - Name: node-express-container
          Image: !Sub 
            - "${RepoUri}:latest"
            - RepoUri: !ImportValue EcsTestEcrRepoUri
          Essential: true
          PortMappings:
            - ContainerPort: 3000
          LogConfiguration:
            LogDriver: awsfirelens
          DependsOn:
            - ContainerName: log_router
              Condition: START
        # FireLens (Fluent Bit) サイドカーコンテナ
        - Name: log_router
          Image: public.ecr.aws/aws-observability/aws-for-fluent-bit:stable
          FirelensConfiguration:
            Type: fluentbit
            # Options:
            #   config-file-type: file 
            #   config-file-value: /extra.conf
          Environment:
            - Name: aws_fluent_bit_init_s3_1
              Value: "arn:aws:s3:::ecs-log-alart-test-2026-02-23/extra.conf" # 仮
          LogConfiguration:
            LogDriver: awslogs
            Options:
              # Fluent Bit自身の動作ログを出力（トラブルシューティング用）
              awslogs-group: !Ref MyLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: fluent-bit-internal

  MyTaskDefinition2:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: example-task-for-ecs-test-2
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt MyTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt MyTaskRole.Arn
      ContainerDefinitions:
        # アプリケーションコンテナ
        - Name: node-express-container
          Image: !Sub 
            - "${RepoUri}:latest"
            - RepoUri: !ImportValue EcsTestEcrRepoUri
          Essential: true
          PortMappings:
            - ContainerPort: 3000
          LogConfiguration: # 標準出力がログに出るか確認
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MyLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app-log-test-2

  MyTaskDefinition3:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: example-task-for-ecs-test-3
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt MyTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt MyTaskRole.Arn
      ContainerDefinitions:
        # アプリケーションコンテナ
        - Name: node-express-container
          Image: !Sub 
            - "${RepoUri}:latest"
            - RepoUri: !ImportValue EcsTestEcrRepoUri
          Essential: true
          PortMappings:
            - ContainerPort: 3000
          LogConfiguration:
            LogDriver: awsfirelens
            Options:
              Name: cloudwatch
              region: !Ref AWS::Region
              log_group_name: !Ref MyLogGroup
              auto_create_group: true
              log_stream_name: "task-3-app-log"
              retry_limit: 2
          DependsOn:
            - ContainerName: log_router
              Condition: START
        # FireLens (Fluent Bit) サイドカーコンテナ
        - Name: log_router
          Image: public.ecr.aws/aws-observability/aws-for-fluent-bit:stable
          FirelensConfiguration:
            Type: fluentbit
          LogConfiguration:
            LogDriver: awslogs
            Options:
              # Fluent Bit自身の動作ログを出力（トラブルシューティング用）
              awslogs-group: !Ref MyLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: fluent-bit-internal

  MyService:
    Type: AWS::ECS::Service
    DependsOn: MyEcsCluster
    Properties:
      ServiceName: test-ecs-service
      Cluster: !Ref MyEcsCluster
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      DesiredCount: 1
      TaskDefinition: !Ref MyTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref PublicECSSecurityGroup
          Subnets:
            - !ImportValue Default-PublicSubnet1Id
            - !ImportValue Default-PublicSubnet2Id

  MyService2:
    Type: AWS::ECS::Service
    DependsOn: MyEcsCluster
    Properties:
      ServiceName: test-ecs-service-2
      Cluster: !Ref MyEcsCluster
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      DesiredCount: 1
      TaskDefinition: !Ref MyTaskDefinition2
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref PublicECSSecurityGroup
          Subnets:
            - !ImportValue Default-PublicSubnet1Id
            - !ImportValue Default-PublicSubnet2Id

  MyService3:
    Type: AWS::ECS::Service
    DependsOn: MyEcsCluster
    Properties:
      ServiceName: test-ecs-service-3
      Cluster: !Ref MyEcsCluster
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      DesiredCount: 1
      TaskDefinition: !Ref MyTaskDefinition3
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref PublicECSSecurityGroup
          Subnets:
            - !ImportValue Default-PublicSubnet1Id
            - !ImportValue Default-PublicSubnet2Id

  # Security Group for ECS
  PublicECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: default-vpc-public-sg-for-ecs-new
      GroupDescription: Allow HTTP/HTTPS access from Internet (and 3000 for ECS Develop)
      VpcId: !ImportValue Default-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: dafault-vpc-PublicECSSecurityGroup

# 元々のアプリのログ設定
