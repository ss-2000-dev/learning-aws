# FluentBit の設定（まださっぱりわかっていない）
# https://docs.fluentbit.io/manual/data-pipeline/outputs/cloudwatch
[OUTPUT]
    Name                cloudwatch_logs
    Match               *
    region              ap-northeast-1
    log_group_name      /aws/ecs/example-task-for-test
    log_stream_prefix   app-log-test # アプリのログ
    auto_create_group   true

[OUTPUT]
    Name                s3
    Match               *
    bucket              ecs-log-alart-test-2026-02-23
    region              ap-northeast-1
    total_file_size     5M
    upload_timeout      1m
    use_put_object      true
    s3_key_format       /app-logs/%Y/%m/%d/$UUID.gz