# FluentBit の設定（まださっぱりわかっていない）
[OUTPUT]
    Name                cloudwatch_logs
    Match               node-express-container-firelens*
    region              ap-northeast-1
    log_group_name      /aws/ecs/example-task-for-test
    log_stream_prefix   fluent-bit-internal
    auto_create_group   true

[OUTPUT]
    Name                s3
    Match               node-express-container-firelens*
    bucket              my-log-archive-bucket
    region              ap-northeast-1
    total_file_size     5M
    upload_timeout      1m
    use_put_object      true
    s3_key_format       /app-logs/%Y/%m/%d/$UUID.gz